name: Node.js build

on:
    push:
        branches: ['**']
    pull_request:
        branches: ['**']

jobs:
    build:
        runs-on: ubuntu-latest

        strategy:
            matrix:
                # 20.x is deliberately absent: `npm run check` runs tests/*.ts
                # directly and relies on Node's own type stripping, which landed
                # in 22.6. On 20 it fails with ERR_UNKNOWN_FILE_EXTENSION.
                # See supported Node.js release schedule at https://nodejs.org/en/about/releases/
                node-version: [22.x, 24.x]

        steps:
            - uses: actions/checkout@v6
            - name: Use Node.js ${{ matrix.node-version }}
              uses: actions/setup-node@v6
              with:
                  node-version: ${{ matrix.node-version }}
                  cache: 'npm'
            - run: npm ci
            - run: npm run build --if-present
            - run: npm run lint
